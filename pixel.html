<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legend Select</title>
  <meta name="description" content="The Brawlhalla Stance Tracker as a legend select screen." />
  <meta name="theme-color" content="#0a0e17" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e17; --bg-2: #111827; --panel: #141b2b; --panel-2: #1b2438; --line: #26314a; --line-2: #33415f;
      --text: #eef2f8; --muted: #9aa6bd; --gold: #d9a441; --gold-2: #f3cf7a;
      --v: #3ccf7a; --bang: #e8a33a; --x: #f07272; --accent: #5aa9ff;
      --shadow: 0 18px 40px rgba(0,0,0,0.45);
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; padding: clamp(16px, 3.5vw, 52px);
      background:
        radial-gradient(1000px 500px at 50% -15%, rgba(217,164,65,0.10), transparent 60%),
        linear-gradient(180deg, #0c1220, var(--bg) 40%);
      background-color: var(--bg);
    }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .wrap { max-width: 1340px; margin: 0 auto; }
    .disp { font-family: 'Barlow Condensed', Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.06em; }

    /* top bar */
    .hud {
      display: grid; grid-template-columns: 1fr auto; gap: 20px 28px; align-items: center;
      background: linear-gradient(135deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 14px;
      padding: 28px 34px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .hud::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, var(--gold-2), var(--gold)); }
    .title { font-size: 2.3rem; font-weight: 800; line-height: 1; }
    .title span { color: var(--gold); }
    .who { margin-top: 12px; font-size: 1rem; font-weight: 700; }
    .who small { color: var(--muted); font-weight: 500; margin-left: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 10px; color: var(--muted); font-size: 0.82rem; align-items: center; }
    .row b { color: var(--text); font-weight: 700; }
    .meter { display: inline-block; width: 140px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; vertical-align: middle; margin-left: 8px; }
    .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius: inherit; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
    .input { width: 180px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line-2); outline: none; }
    .input:focus { border-color: var(--gold); }
    .btn {
      padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer;
      font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.95rem;
    }
    .btn:hover { border-color: var(--gold); }
    .btn.gold { background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: #1a1206; border-color: transparent; }
    .btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-2); background: rgba(217,164,65,0.12); }
    .btn[disabled] { opacity: 0.6; cursor: progress; }
    .msg { min-height: 1.4em; color: var(--muted); margin: 18px 4px 22px; font-size: 0.88rem; }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; align-items: center; }
    .filters .btn { padding: 8px 18px; font-size: 0.92rem; }
    .hint { color: var(--muted); margin-left: auto; font-size: 0.78rem; }
    .hint kbd { font-family: Inter, sans-serif; font-size: 0.72rem; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--panel); }

    /* legend grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 22px; }
    .tile {
      position: relative; border-radius: 12px; overflow: hidden; cursor: pointer; outline: none;
      background: var(--panel); border: 1px solid var(--line); aspect-ratio: 3 / 4;
      display: flex; flex-direction: column; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .tile:hover { transform: translateY(-2px); border-color: var(--line-2); }
    .tile.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(217,164,65,0.35), var(--shadow); transform: translateY(-3px); }
    .tile.x .art { filter: grayscale(0.9) brightness(0.6); }
    .art { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .art img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(10,14,23,0.92)); }
    .emblem {
      width: 100%; height: 100%; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 38%, hsl(var(--hue) 45% 34%), hsl(var(--hue) 40% 12%) 72%);
    }
    .emblem .crest { width: 62%; height: auto; margin-top: -22%; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.55)); }
    .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px 13px; z-index: 1; }
    .tname { font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 1.08rem; text-transform: uppercase; letter-spacing: 0.04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
    .tmeta { display: flex; justify-content: space-between; align-items: center; font-size: 0.74rem; color: #c9d2e3; margin: 2px 0 6px; }
    .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,0.14); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; }
    .bar.v i { background: var(--v); } .bar.bang i { background: var(--bang); } .bar.x i { background: var(--x); }
    .badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; font-weight: 800; font-size: 0.72rem; }
    .badge.v { background: rgba(60,207,122,0.18); color: var(--v); }
    .badge.bang { background: rgba(232,163,58,0.18); color: var(--bang); }
    .badge.x { background: rgba(240,114,114,0.16); color: var(--x); }
    .corner { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 1; font-size: 0.7rem; }
    .corner .num { color: rgba(255,255,255,0.75); font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    .corner .pin { color: var(--gold-2); text-shadow: 0 1px 4px rgba(0,0,0,0.9); }

    /* details panel */
    .dialog-wrap { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(5,8,14,0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 16px; }
    .dialog-wrap.open { display: grid; place-items: center; }
    .dialog {
      width: min(860px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; grid-template-columns: 260px 1fr;
      background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow);
    }
    .dialog .portrait { position: relative; min-height: 320px; border-radius: 16px 0 0 16px; overflow: hidden; }
    .dialog .portrait .art { position: absolute; inset: 0; }
    .dialog .portrait .emblem .crest { width: 58%; margin-top: 0; }
    .dialog .body { padding: 30px 32px; }
    .dialog h2 { font-size: 2rem; font-weight: 800; line-height: 1; display: flex; gap: 10px; align-items: center; }
    .dialog .sub { color: var(--muted); margin: 4px 0 14px; }
    .callout { padding: 12px 14px; border-radius: 10px; background: rgba(217,164,65,0.10); border: 1px solid rgba(217,164,65,0.35); color: var(--gold-2); font-weight: 600; margin-bottom: 14px; }
    .stances { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
    .stances div { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); font-size: 0.84rem; color: var(--muted); }
    .stances div.on { color: var(--text); border-color: rgba(60,207,122,0.35); }
    .stances div.tgt { box-shadow: inset 3px 0 0 var(--gold); }
    .stances b { color: var(--gold); margin-right: 6px; font-variant-numeric: tabular-nums; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 0.86rem; margin-bottom: 22px; }
    .stats b { color: var(--text); }
    .acts { display: flex; flex-wrap: wrap; gap: 8px; }

    .footer { margin: 64px 0 12px; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 0.82rem; color: var(--muted); }
    .footer a { color: var(--gold-2); text-decoration: none; font-weight: 600; }
    .credit { text-align: center; color: var(--muted); font-size: 0.74rem; margin-bottom: 8px; }

    @media (max-width: 720px) {
      body { padding: 10px; }
      .hud { grid-template-columns: 1fr; padding: 20px 20px; }
      .controls { justify-content: flex-start; }
      .input { flex: 1; width: auto; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
      .hint { display: none; }
      .dialog { grid-template-columns: 1fr; }
      .dialog .portrait { min-height: 200px; border-radius: 16px 16px 0 0; }
    }
    @media (prefers-reduced-motion: reduce) { .tile, .tile:hover, .tile.sel { transition: none; transform: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div>
        <div class="title disp">Legend <span>Select</span></div>
        <div class="who" id="pname">No player loaded</div>
        <div class="row" id="pstats"></div>
      </div>
      <div class="controls">
        <input class="input" id="idInput" inputmode="numeric" placeholder="Brawlhalla ID" autocomplete="off" aria-label="Brawlhalla ID" />
        <button class="btn gold" id="syncBtn">Load</button>
        <button class="btn" id="soundBtn" aria-pressed="false" aria-label="Sound effects">Sound off</button>
      </div>
    </div>
    <div class="msg" id="msg">Enter your Brawlhalla ID and press Load.</div>

    <div class="filters" id="filters">
      <button class="btn" data-f="ALL" aria-pressed="true">All</button>
      <button class="btn" data-f="v" aria-pressed="false">Target</button>
      <button class="btn" data-f="!" aria-pressed="false">Standard</button>
      <button class="btn" data-f="x" aria-pressed="false">Locked</button>
      <button class="btn" data-f="PIN" aria-pressed="false">★ Pinned</button>
      <span class="hint"><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>Enter</kbd> details · <kbd>Esc</kbd> back</span>
    </div>
    <div class="grid" id="grid" role="listbox" aria-label="Legends"></div>

    <div class="footer">
      <a href="index.html?view=desktop">Desktop</a>
      <a href="app.html?view=mobile">Mobile</a>
      <a href="cards.html">Cards</a>
      <a href="matrix.html">Matrix</a>
      <a href="terminal.html">Terminal</a>
      <a href="compare.html">Compare</a>
      <a href="roadmap.html">Roadmap</a>
    </div>
    <p class="credit">Brawlhalla and its legends belong to Blue Mammoth Games / Ubisoft. Not affiliated.</p>
  </div>

  <div class="dialog-wrap" id="dialogWrap">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="Legend details"></div>
  </div>

  <script src="legends.js"></script>
  <script src="core.js"></script>
  <script src="goals.js"></script>
  <script src="crest.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const { state } = Tracker;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const cls = st => (st === 'v' ? 'v' : st === '!' ? 'bang' : 'x');
    let filter = 'ALL';
    let sel = 0;
    let visible = [];
    let sound = false;
    let dialogOpen = false;

    // ---------- portraits ----------
    // Legend art is not bundled. Put your own images in portraits/ (e.g. portraits/lord-vraxx.png) and
    // list the file names in portraits/index.json, e.g. ["bodvar.png", "lord-vraxx.png"].
    // Legends without a portrait get an original crest (crest.js) instead.
    const slug = name => name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, ' ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    let portraits = {};
    async function loadPortraits() {
      try {
        const res = await fetch('portraits/index.json', { cache: 'no-cache' });
        if (!res.ok) return;
        const files = await res.json();
        if (!Array.isArray(files)) return;
        files.filter(f => typeof f === 'string' && /^[a-z0-9-]+\.(png|jpe?g|webp|avif)$/i.test(f))
          .forEach(f => { portraits[f.replace(/\.[a-z]+$/i, '').toLowerCase()] = `portraits/${f}`; });
      } catch (err) { /* no portraits folder */ }
    }
    function hueOf(name) {
      let h = 0;
      for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
      return h;
    }
    // big: the details panel, which shows the crest's initials banner; tiles already show the name
    function artHtml(name, big = false) {
      const src = portraits[slug(name)];
      return src
        ? `<div class="art"><img src="${esc(src)}" alt="" loading="lazy" onerror="this.parentNode.outerHTML=window.emblemHtml(${esc(JSON.stringify(name))}, ${big})" /></div>`
        : emblemHtml(name, big);
    }
    function emblemHtml(name, big = false) {
      const l = LEGENDS_DB.find(x => x.name === name);
      return `<div class="art"><div class="emblem" style="--hue:${hueOf(name)}">${Crest.svg(l, Tracker.statusOf(l, Tracker.getLevel(name)), { banner: big })}</div></div>`;
    }
    window.emblemHtml = emblemHtml;

    // ---------- sound (soft UI clicks, off by default) ----------
    let audio = null;
    function click(freq = 520, dur = 0.05) {
      if (!sound) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + dur);
      } catch (err) { /* no audio */ }
    }
    function chord() { [523, 659, 784].forEach((f, i) => setTimeout(() => click(f, 0.18), i * 90)); }

    // ---------- render ----------
    function renderHud() {
      const p = state.profile;
      const v = LEGENDS_DB.filter(l => Tracker.getLevel(l.name) >= l.vLvl).length;
      $('pname').innerHTML = p ? `${esc(p.name)}<small>#${esc(p.id)}</small>` : 'No player loaded';
      $('pstats').innerHTML = `
        <span>Account level <b>${p && p.level ? p.level : '–'}</b></span>
        <span>Games <b>${p ? (p.games || 0).toLocaleString() : '–'}</b></span>
        <span>Target stances <b>${v} / 70</b><span class="meter"><i style="width:${(v / 70) * 100}%"></i></span></span>`;
    }

    function renderGrid() {
      visible = LEGENDS_DB.filter(l => {
        const st = Tracker.statusOf(l, Tracker.getLevel(l.name));
        return filter === 'ALL' || (filter === 'PIN' ? Goals.has(l.name) : st === filter);
      });
      sel = Math.min(sel, Math.max(0, visible.length - 1));
      $('grid').innerHTML = visible.length ? visible.map((l, i) => {
        const lvl = Tracker.getLevel(l.name);
        const st = Tracker.statusOf(l, lvl);
        return `<div class="tile ${cls(st)}${i === sel ? ' sel' : ''}" role="option" aria-selected="${i === sel}" data-i="${i}" tabindex="${i === sel ? 0 : -1}"
                     aria-label="${esc(l.name)}, level ${lvl}">
          ${artHtml(l.name)}
          <div class="corner"><span class="num">#${l.order}</span>${Goals.has(l.name) ? '<span class="pin" title="Pinned goal">★</span>' : ''}</div>
          <div class="info">
            <div class="tname">${esc(l.name)}</div>
            <div class="tmeta"><span>Lv ${lvl}</span><span class="badge ${cls(st)}">${st}</span></div>
            <div class="bar ${cls(st)}"><i style="width:${Math.round(Tracker.progressToNext(l, lvl) * 100)}%"></i></div>
          </div>
        </div>`;
      }).join('') : '<div class="msg">No legends in this group.</div>';
    }

    function render() { renderHud(); renderGrid(); if (dialogOpen) renderDialog(); }

    function moveSel(delta) {
      if (!visible.length) return;
      const next = Math.max(0, Math.min(visible.length - 1, sel + delta));
      if (next === sel) return;
      const tiles = $('grid').querySelectorAll('.tile');
      if (tiles[sel]) { tiles[sel].classList.remove('sel'); tiles[sel].setAttribute('aria-selected', 'false'); tiles[sel].tabIndex = -1; }
      sel = next;
      if (tiles[sel]) {
        tiles[sel].classList.add('sel');
        tiles[sel].setAttribute('aria-selected', 'true');
        tiles[sel].tabIndex = 0;
        tiles[sel].focus({ preventScroll: true });
        tiles[sel].scrollIntoView && tiles[sel].scrollIntoView({ block: 'nearest' });
      }
      click(700, 0.03);
    }
    const columns = () => {
      const tiles = $('grid').querySelectorAll('.tile');
      if (tiles.length < 2 || !tiles[0].getBoundingClientRect) return 1;
      const top = tiles[0].getBoundingClientRect().top;
      let n = 0;
      for (const t of tiles) { if (t.getBoundingClientRect().top !== top) break; n++; }
      return Math.max(1, n);
    };

    // ---------- details ----------
    function renderDialog() {
      const l = visible[sel];
      if (!l) return closeDialog();
      const lvl = Tracker.getLevel(l.name);
      const st = Tracker.statusOf(l, lvl);
      const next = Tracker.nextTarget(l, lvl);
      const s = state.stats[l.name];
      const targets = l.target.replace(/[()]/g, '').split(/\s+or\s+/i).map(x => x.trim());
      $('dialog').innerHTML = `
        <div class="portrait">${artHtml(l.name, true)}</div>
        <div class="body">
          <h2 class="disp">${esc(l.name)} <span class="badge ${cls(st)}">${st}</span></h2>
          <div class="sub">${esc(l.title)} · #${l.order} · level ${lvl}</div>
          <div class="callout">${next ? `${next.lvl - lvl} more level${next.lvl - lvl === 1 ? '' : 's'} to unlock ${esc(next.what)} (${next.status}).` : 'Target stance unlocked.'}</div>
          <div class="stances">
            ${[3, 4, 6, 8, 11, 13, 15, 17].map(sl => `<div class="${lvl >= sl ? 'on' : ''}${targets.includes(l.stances[sl]) ? ' tgt' : ''}"><span><b>${sl}</b>${esc(l.stances[sl])}</span><span>${lvl >= sl ? '✓' : '🔒'}</span></div>`).join('')}
          </div>
          ${s ? `<div class="stats"><span>Games <b>${(s.games || 0).toLocaleString()}</b></span><span>Win rate <b>${s.games ? Math.round((s.wins / s.games) * 100) : 0}%</b></span><span>Time <b>${((s.time || 0) / 3600).toFixed(1)}h</b></span>${(s.weapons || []).filter(Boolean).length ? `<span>Weapons <b>${esc(s.weapons.filter(Boolean).join(' · '))}</b></span>` : ''}</div>` : ''}
          <div class="acts">
            <button class="btn" data-act="down" aria-label="Level down">Level −</button>
            <button class="btn" data-act="up" aria-label="Level up">Level +</button>
            <button class="btn" data-act="pin" aria-pressed="${Goals.has(l.name)}">${Goals.has(l.name) ? '★ Pinned' : '☆ Pin goal'}</button>
            <button class="btn gold" data-act="close">Back</button>
          </div>
        </div>`;
    }
    function openDialog() {
      if (!visible[sel]) return;
      dialogOpen = true;
      renderDialog();
      $('dialogWrap').classList.add('open');
      click(620, 0.07);
      const back = $('dialog').querySelector('[data-act="close"]');
      back && back.focus && back.focus();
    }
    function closeDialog() {
      dialogOpen = false;
      $('dialogWrap').classList.remove('open');
      click(420, 0.05);
      const tile = $('grid').querySelector('.tile.sel');
      tile && tile.focus && tile.focus({ preventScroll: true });
    }

    // ---------- sync ----------
    async function load() {
      const id = $('idInput').value.trim();
      if (!/^\d+$/.test(id)) { $('msg').textContent = 'Brawlhalla ID must be a number.'; return; }
      Tracker.setId(id);
      $('syncBtn').disabled = true;
      $('msg').textContent = 'Loading…';
      const r = await Tracker.sync();
      $('syncBtn').disabled = false;
      if (r.error) { $('msg').textContent = `Sync failed: ${r.error}`; return; }
      $('msg').textContent = r.updated ? `Loaded ${r.updated} legends · ${new Date().toLocaleTimeString()}` : 'Loaded, but no levels came back (dair.gg may be down).';
      render();
      const targets = r.unlocks.filter(u => { const l = LEGENDS_DB.find(x => x.name === u.legend); return l && u.lvl === l.vLvl; });
      if (targets.length && targets.length <= 5) {
        chord();
        $('msg').textContent += ` · New target stance: ${targets.map(u => u.legend).join(', ')}`;
      }
    }

    // ---------- events ----------
    $('grid').addEventListener('click', e => {
      const t = e.target.closest('.tile');
      if (!t) return;
      const i = Number(t.dataset.i);
      if (i !== sel) moveSel(i - sel);
      openDialog();
    });
    $('dialog').addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const l = visible[sel];
      if (b.dataset.act === 'close') return closeDialog();
      if (b.dataset.act === 'pin') {
        if (!Goals.toggle(l.name)) { $('msg').textContent = `You can pin up to ${Goals.MAX} legends.`; return; }
        click(880, 0.06);
      } else {
        Tracker.setLevel(l.name, Tracker.getLevel(l.name) + (b.dataset.act === 'up' ? 1 : -1));
        click(b.dataset.act === 'up' ? 760 : 380, 0.05);
      }
      render();
    });
    $('dialogWrap').addEventListener('click', e => { if (e.target === $('dialogWrap')) closeDialog(); });
    $('filters').addEventListener('click', e => {
      const b = e.target.closest('[data-f]');
      if (!b) return;
      filter = b.dataset.f;
      sel = 0;
      document.querySelectorAll('#filters [data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      click(600, 0.04);
      renderGrid();
    });
    document.addEventListener('keydown', e => {
      if (e.target === $('idInput')) { if (e.key === 'Enter') load(); return; }
      if (dialogOpen) {
        if (e.key === 'Escape') { e.preventDefault(); closeDialog(); }
        return;
      }
      const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns(), ArrowDown: columns() };
      if (e.key in moves) { e.preventDefault(); moveSel(moves[e.key]); }
      else if (e.key === 'Enter' || e.key === ' ') { if (e.target.closest && e.target.closest('.grid')) { e.preventDefault(); openDialog(); } }
    });
    $('syncBtn').addEventListener('click', load);
    $('soundBtn').addEventListener('click', () => {
      sound = !sound;
      $('soundBtn').setAttribute('aria-pressed', String(sound));
      $('soundBtn').textContent = sound ? 'Sound on' : 'Sound off';
      try { localStorage.setItem('bh_select_sound_v1', sound ? '1' : '0'); } catch (err) { /* ignore */ }
      click(660, 0.06);
    });

    // ---------- start ----------
    try { sound = localStorage.getItem('bh_select_sound_v1') === '1'; } catch (err) { /* ignore */ }
    $('soundBtn').setAttribute('aria-pressed', String(sound));
    $('soundBtn').textContent = sound ? 'Sound on' : 'Sound off';
    const linkId = new URLSearchParams(location.search).get('id');
    $('idInput').value = linkId && /^\d+$/.test(linkId) ? linkId : state.id;
    render();
    loadPortraits().then(() => { if (Object.keys(portraits).length) render(); });
    if (state.profile) $('msg').textContent = 'Saved data loaded. Press Load to refresh.';
    if (linkId && /^\d+$/.test(linkId)) { history.replaceState(null, '', location.pathname); load(); }
    else if (state.id && (!state.profile || Date.now() - state.profile.syncedAt > 10 * 60 * 1000)) load();
  </script>
  <script>
    // Offline support (only works over http/https, not when opened as a file)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
