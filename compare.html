<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Compare</title>
  <meta name="description" content="Compare two Brawlhalla players legend by legend." />
  <meta name="theme-color" content="#0b101d" />
  <script src="theme-boot.js" data-page="compare"></script>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0b101d; --panel: #131b2e; --card: #1a2540; --line: #2a395c; --text: #f1f5f9; --muted: #94a3b8;
      --a: #3b82f6; --b: #f43f5e; --tie: #94a3b8; --accent: #06b6d4;
      --v: #22c55e; --bang: #f59e0b; --x: #ef4444;
      --track: rgba(148,163,184,0.14);
      color-scheme: dark;
    }
    :root[data-theme="valhalla"] {
      --bg: #120c1f; --panel: #1d1430; --card: #2a1d45; --line: #4a3470; --text: #fdf6e3; --muted: #b8a9d4;
      --a: #f5c542; --b: #c084fc; --accent: #f5c542;
    }
    :root[data-theme="daylight"] {
      --bg: #f4f6fb; --panel: #ffffff; --card: #eef2f8; --line: #d5dce8; --text: #0f172a; --muted: #5b6678;
      --a: #2563eb; --b: #e11d48; --accent: #0e7490; --v: #15803d; --bang: #b45309; --x: #b91c1c;
      --track: rgba(15,23,42,0.08);
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 16px; min-height: 100vh; }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 4px; }
    .lead { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; }

    .pick { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 10px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .pick label { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .pick label.la { color: var(--a); }
    .pick label.lb { color: var(--b); }
    .pick input { width: 100%; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); outline: none; font-size: 1rem; }
    .pick input:focus { border-color: var(--accent); }
    .vs-mid { font-weight: 900; color: var(--muted); padding-bottom: 10px; }
    .btn { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 800; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #04141a; }
    :root[data-theme="daylight"] .btn.primary { color: #fff; }
    .btn[disabled] { opacity: 0.6; cursor: progress; }
    .status { min-height: 1.3em; font-size: 0.84rem; color: var(--muted); margin: 10px 2px; }
    .status .err { color: var(--x); }

    /* scoreboard */
    .board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
    .side { padding: 16px; }
    .side.a { border-top: 4px solid var(--a); }
    .side.b { border-top: 4px solid var(--b); text-align: right; }
    .side .who { font-size: 1.2rem; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side .id { font-size: 0.75rem; color: var(--muted); }
    .side .wins { font-size: 2rem; font-weight: 900; margin-top: 6px; }
    .side.a .wins { color: var(--a); }
    .side.b .wins { color: var(--b); }
    .side .wins small { font-size: 0.75rem; color: var(--muted); font-weight: 700; display: block; }
    .cats { padding: 12px 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 300px; }
    .cat { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 5px 14px; font-size: 0.85rem; }
    .cat .va { text-align: right; font-weight: 800; }
    .cat .vb { text-align: left; font-weight: 800; }
    .cat .k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); font-weight: 800; text-align: center; min-width: 110px; }
    .cat .win-a { color: var(--a); }
    .cat .win-b { color: var(--b); }
    .cat .win-a::after { content: ' ◀'; font-size: 0.7rem; }
    .cat .win-b::before { content: '▶ '; font-size: 0.7rem; }

    /* legend table */
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg button { padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 0.82rem; font-weight: 700; }
    .seg button b { margin-left: 3px; }
    .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--card); }
    .select { padding: 8px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
    .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .row { display: grid; grid-template-columns: 1fr 64px 150px 64px 1fr; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
    .row:last-child { border-bottom: none; }
    .row.head { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); font-weight: 800; background: var(--card); }
    .bar-a, .bar-b { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; display: flex; }
    .bar-a { justify-content: flex-end; }
    .bar-a i, .bar-b i { display: block; height: 100%; border-radius: inherit; }
    .bar-a i { background: var(--a); }
    .bar-b i { background: var(--b); }
    .lv { font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
    .lv .st { font-size: 0.7rem; font-weight: 900; margin-left: 3px; }
    .st-v { color: var(--v); } .st-bang { color: var(--bang); } .st-x { color: var(--x); }
    .mid { text-align: center; }
    .mid .n { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .mid .d { font-size: 0.72rem; font-weight: 800; }
    .d.a { color: var(--a); } .d.b { color: var(--b); } .d.t { color: var(--tie); }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    .hidden { display: none !important; }
    footer { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; font-size: 0.8rem; color: var(--muted); }
    footer a { color: var(--accent); text-decoration: none; font-weight: 700; }

    @media (max-width: 720px) {
      body { padding: 10px; }
      .pick { grid-template-columns: 1fr; }
      .vs-mid { text-align: center; padding: 0; }
      .board { grid-template-columns: 1fr 1fr; }
      .cats { grid-column: 1 / -1; grid-row: 2; min-width: 0; border: none; border-top: 1px solid var(--line); }
      .row { grid-template-columns: 1fr 46px 104px 46px 1fr; gap: 5px; padding: 7px 8px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚔️ Player Compare</h1>
    <p class="lead">Put two Brawlhalla IDs head to head, legend by legend. Nothing here changes your saved levels.</p>

    <form class="pick" id="pickForm">
      <div><label class="la" for="idA">Player A</label><input id="idA" inputmode="numeric" placeholder="Brawlhalla ID" autocomplete="off" /></div>
      <div class="vs-mid">VS</div>
      <div><label class="lb" for="idB">Player B</label><input id="idB" inputmode="numeric" placeholder="Brawlhalla ID" autocomplete="off" /></div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="goBtn" type="submit">Compare</button>
        <button class="btn" id="shareBtn" type="button" title="Copy a link to this comparison" aria-label="Copy a link to this comparison">🔗</button>
      </div>
    </form>
    <div class="status" id="status"></div>

    <section id="result" class="hidden">
      <div class="board">
        <div class="side a"><div class="who" id="nameA"></div><div class="id" id="subA"></div><div class="wins" id="winsA"></div></div>
        <div class="cats" id="cats"></div>
        <div class="side b"><div class="who" id="nameB"></div><div class="id" id="subB"></div><div class="wins" id="winsB"></div></div>
      </div>

      <div class="controls">
        <div class="seg" id="seg">
          <button data-f="all" aria-pressed="true">All<b id="nAll"></b></button>
          <button data-f="a" aria-pressed="false" id="segA">A ahead<b id="nA"></b></button>
          <button data-f="b" aria-pressed="false" id="segB">B ahead<b id="nB"></b></button>
          <button data-f="t" aria-pressed="false">Tied<b id="nT"></b></button>
        </div>
        <select class="select" id="sort" aria-label="Sort">
          <option value="gap">Biggest gap</option>
          <option value="order">Champ select order</option>
          <option value="a">Player A level</option>
          <option value="b">Player B level</option>
        </select>
      </div>
      <div class="rows" id="rows"></div>
    </section>

    <footer>
      <a href="index.html?view=desktop">Desktop view</a>
      <a href="app.html?view=mobile">Mobile view</a>
      <a href="cards.html">Card collection</a>
      <a href="matrix.html">Stance matrix</a>
      <a href="terminal.html">Terminal</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="pixel.html">Legend select</a>
      <a href="stances.html">Stance lab</a>
    </footer>
  </div>

  <script src="legends.js"></script>
  <script src="core.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const stCls = st => (st === 'v' ? 'st-v' : st === '!' ? 'st-bang' : 'st-x');
    let A = null, B = null, filter = 'all';

    // Per-legend level map; null when the API gave no level for that account
    function levelsOf(p) {
      const m = {};
      p.legends.forEach(l => { if (l.level !== null) m[l.name] = l.level; });
      return m;
    }
    function totals(p) {
      const lv = levelsOf(p);
      const get = name => lv[name] || 1;
      return {
        hasLevels: Object.keys(lv).length > 0,
        targets: LEGENDS_DB.filter(l => get(l.name) >= l.vLvl).length,
        stances: LEGENDS_DB.reduce((n, l) => n + [3, 4, 6, 8, 11, 13, 15, 17].filter(s => get(l.name) >= s).length, 0),
        legendLevels: LEGENDS_DB.reduce((n, l) => n + get(l.name), 0),
        get
      };
    }

    function renderBoard(ta, tb) {
      const cats = [
        ['Account level', A.level || 0, B.level || 0],
        ['Games played', A.games || 0, B.games || 0],
        ['Win rate', A.games ? Math.round((A.wins / A.games) * 100) : 0, B.games ? Math.round((B.wins / B.games) * 100) : 0, '%'],
        ['Target stances', ta.targets, tb.targets, '/70'],
        ['Stances unlocked', ta.stances, tb.stances, '/560'],
        ['Total legend levels', ta.legendLevels, tb.legendLevels]
      ];
      let wa = 0, wb = 0;
      $('cats').innerHTML = cats.map(([k, va, vb, unit = '']) => {
        const ca = va > vb ? 'win-a' : '', cb = vb > va ? 'win-b' : '';
        if (va > vb) wa++; else if (vb > va) wb++;
        return `<div class="cat"><span class="va ${ca}">${va.toLocaleString()}${unit}</span><span class="k">${k}</span><span class="vb ${cb}">${vb.toLocaleString()}${unit}</span></div>`;
      }).join('');
      $('nameA').textContent = A.name; $('nameB').textContent = B.name;
      $('subA').textContent = `#${A.id}`; $('subB').textContent = `#${B.id}`;
      $('winsA').innerHTML = `${wa}<small>categories won</small>`;
      $('winsB').innerHTML = `${wb}<small>categories won</small>`;
      $('segA').firstChild.textContent = `${A.name.length > 12 ? 'A' : A.name} ahead`;
      $('segB').firstChild.textContent = `${B.name.length > 12 ? 'B' : B.name} ahead`;
    }

    function renderRows(ta, tb) {
      const all = LEGENDS_DB.map(l => {
        const la = ta.get(l.name), lb = tb.get(l.name);
        return { l, la, lb, d: la - lb };
      });
      $('nAll').textContent = all.length;
      $('nA').textContent = all.filter(r => r.d > 0).length;
      $('nB').textContent = all.filter(r => r.d < 0).length;
      $('nT').textContent = all.filter(r => r.d === 0).length;
      const sortBy = $('sort').value;
      const list = all.filter(r => filter === 'all' || (filter === 'a' ? r.d > 0 : filter === 'b' ? r.d < 0 : r.d === 0))
        .sort((x, y) => sortBy === 'order' ? x.l.order - y.l.order
          : sortBy === 'a' ? y.la - x.la || x.l.order - y.l.order
          : sortBy === 'b' ? y.lb - x.lb || x.l.order - y.l.order
          : Math.abs(y.d) - Math.abs(x.d) || x.l.order - y.l.order);
      const max = Math.max(1, ...all.map(r => Math.max(r.la, r.lb)));
      const head = `<div class="row head"><span style="text-align:right">${esc(A.name)}</span><span class="lv">Lv</span><span class="mid">Legend</span><span class="lv">Lv</span><span>${esc(B.name)}</span></div>`;
      $('rows').innerHTML = head + (list.length ? list.map(({ l, la, lb, d }) => {
        const sa = Tracker.statusOf(l, la), sb = Tracker.statusOf(l, lb);
        const diff = d > 0 ? `<span class="d a">A +${d}</span>` : d < 0 ? `<span class="d b">B +${-d}</span>` : `<span class="d t">tied</span>`;
        return `<div class="row">
          <div class="bar-a"><i style="width:${(la / max) * 100}%"></i></div>
          <span class="lv">${la}<span class="st ${stCls(sa)}">${sa}</span></span>
          <span class="mid"><span class="n">${esc(l.name)}</span>${diff}</span>
          <span class="lv">${lb}<span class="st ${stCls(sb)}">${sb}</span></span>
          <div class="bar-b"><i style="width:${(lb / max) * 100}%"></i></div>
        </div>`;
      }).join('') : '<div class="empty">No legends in this group.</div>');
    }

    function render() {
      if (!A || !B) return;
      const ta = totals(A), tb = totals(B);
      renderBoard(ta, tb);
      renderRows(ta, tb);
      const missing = [!ta.hasLevels && A.name, !tb.hasLevels && B.name].filter(Boolean);
      if (missing.length) $('status').innerHTML = `<span class="err">No legend levels came back for ${esc(missing.join(' and '))} (dair.gg may be down), so their legends count as level 1.</span>`;
    }

    async function compare() {
      const a = $('idA').value.trim(), b = $('idB').value.trim();
      if (!/^\d+$/.test(a) || !/^\d+$/.test(b)) { $('status').innerHTML = '<span class="err">Enter two numeric Brawlhalla IDs.</span>'; return; }
      if (a === b) { $('status').innerHTML = '<span class="err">Pick two different players.</span>'; return; }
      $('goBtn').disabled = true;
      $('status').textContent = 'Loading both players…';
      const [ra, rb] = await Promise.all([Tracker.lookup(a), Tracker.lookup(b)]);
      $('goBtn').disabled = false;
      if (ra.error || rb.error) {
        $('status').innerHTML = `<span class="err">${esc(ra.error ? `Player A: ${ra.error}` : `Player B: ${rb.error}`)}</span>`;
        return;
      }
      A = ra.player; B = rb.player;
      $('status').textContent = `Loaded ${A.name} and ${B.name} · ${new Date().toLocaleTimeString()}`;
      $('result').classList.remove('hidden');
      render();
      history.replaceState(null, '', `${location.pathname}?a=${a}&b=${b}`);
    }

    $('pickForm').addEventListener('submit', e => { e.preventDefault(); compare(); });
    $('seg').addEventListener('click', e => {
      const btn = e.target.closest('[data-f]');
      if (!btn) return;
      filter = btn.dataset.f;
      document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
      if (A && B) renderRows(totals(A), totals(B));
    });
    $('sort').addEventListener('change', () => { if (A && B) renderRows(totals(A), totals(B)); });
    $('shareBtn').addEventListener('click', () => {
      const a = $('idA').value.trim(), b = $('idB').value.trim();
      if (!/^\d+$/.test(a) || !/^\d+$/.test(b)) { $('status').innerHTML = '<span class="err">Enter both IDs first.</span>'; return; }
      const url = `${location.origin}${location.pathname}?a=${a}&b=${b}`;
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(() => { $('status').textContent = 'Link copied.'; });
      else prompt('Copy this link:', url);
    });

    const q = new URLSearchParams(location.search);
    const qa = q.get('a'), qb = q.get('b');
    $('idA').value = qa && /^\d+$/.test(qa) ? qa : Tracker.state.id;
    if (qb && /^\d+$/.test(qb)) $('idB').value = qb;
    if ($('idA').value && $('idB').value) compare();
    else $(Tracker.state.id ? 'idB' : 'idA').focus();
  </script>
  <script>
    // Offline support (only works over http/https, not when opened as a file)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
