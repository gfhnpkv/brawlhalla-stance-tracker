<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Legend Collection</title>
  <meta name="description" content="Your Brawlhalla legends as a card collection: foil when the target stance is unlocked." />
  <meta name="theme-color" content="#07060d" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07060d;
      --bg-2: #110e1f;
      --panel: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.09);
      --text: #f4efe6;
      --muted: #9a93ad;
      --gold: #f2c14e;
      --gold-2: #ffe8a3;
      --silver: #9fc3ff;
      --locked: #5b5670;
      --x: #ff6b6b;
      --card-w: 200px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(242,193,78,0.12), transparent 60%),
        radial-gradient(800px 500px at 100% 100%, rgba(120,90,255,0.10), transparent 60%),
        var(--bg);
      background-color: var(--bg);
      padding: 0 16px 48px;
    }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* ---------- header ---------- */
    .top { max-width: 1240px; margin: 0 auto; padding: 22px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
    .meter { position: relative; width: 118px; height: 118px; flex: none; }
    .meter svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .meter circle { fill: none; stroke-width: 9; }
    .meter .track { stroke: rgba(255,255,255,0.08); }
    .meter .fill { stroke: url(#goldGrad); stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
    .meter-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .meter-text b { font-family: Cinzel, serif; font-size: 1.7rem; line-height: 1; }
    .meter-text span { font-size: 0.68rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }
    .title-block { flex: 1; min-width: 240px; }
    .eyebrow { font-size: 0.72rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); font-weight: 800; }
    h1 { font-family: Cinzel, serif; font-weight: 900; font-size: clamp(1.7rem, 4vw, 2.5rem); letter-spacing: 1px; margin: 2px 0 4px;
      background: linear-gradient(180deg, #fff6dc, var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .stars { color: var(--gold); letter-spacing: 3px; font-size: 1.05rem; }
    .stars .off { color: rgba(255,255,255,0.15); }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .sub b { color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .id-input { width: 170px; padding: 10px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); outline: none; }
    .id-input:focus { border-color: var(--gold); }
    .pill-btn { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 700; font-size: 0.88rem; }
    .pill-btn.gold { background: linear-gradient(135deg, var(--gold), #e08a1e); color: #1b1206; border-color: transparent; }
    .pill-btn:hover { border-color: var(--gold); }
    .pill-btn[disabled] { opacity: 0.6; cursor: progress; }
    .status { max-width: 1240px; margin: 4px auto 0; font-size: 0.82rem; color: var(--muted); min-height: 1.2em; }

    /* ---------- toolbar ---------- */
    .toolbar { max-width: 1240px; margin: 16px auto 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
    .tab b { color: var(--text); margin-left: 4px; }
    .tab[aria-pressed="true"] { background: var(--panel); color: var(--text); border-color: var(--gold); }
    .tab.t-v b { color: var(--gold); }
    .tab.t-bang b { color: var(--silver); }
    .tab.t-x b { color: var(--x); }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .search, .sort { padding: 9px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); outline: none; font-size: 0.88rem; }
    .search { width: 220px; }
    .search:focus, .sort:focus { border-color: var(--gold); }
    .sort option { background: var(--bg-2); }

    /* ---------- cards ---------- */
    .grid { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr)); gap: 18px; }
    .card { perspective: 1000px; aspect-ratio: 5 / 7; cursor: pointer; outline: none; border-radius: 16px; }
    .card-inner {
      position: relative; width: 100%; height: 100%; border-radius: 16px;
      transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; border-radius: 16px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; flex-direction: column; padding: 12px;
      background: linear-gradient(160deg, hsl(var(--hue) 45% 22%), hsl(var(--hue) 40% 9%) 70%);
      border: 2px solid var(--frame);
      box-shadow: 0 14px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .back { transform: rotateY(180deg); background: linear-gradient(160deg, #1b1630, #0c0a16); }
    .card:focus-visible .face { outline: 2px solid var(--gold); outline-offset: 3px; }

    .r-v { --frame: var(--gold); }
    .r-bang { --frame: #6f8fc7; }
    .r-x { --frame: #3a3650; }
    .r-x .front { filter: grayscale(0.85) brightness(0.7); }

    /* Foil shimmer on target-unlocked cards, follows the pointer */
    .r-v .front::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: 0.55;
      background:
        radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255,255,255,0.45), transparent 45%),
        linear-gradient(115deg, transparent 20%, rgba(255,220,120,0.35) 35%, rgba(160,120,255,0.3) 50%, rgba(120,220,255,0.3) 62%, transparent 78%);
      background-size: 100% 100%, 250% 250%;
      background-position: center, 0% 50%;
      animation: foil 6s linear infinite;
    }
    @keyframes foil { to { background-position: center, 250% 50%; } }

    .front-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
    .num { font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
    .gem {
      min-width: 38px; height: 38px; padding: 0 6px; border-radius: 12px; display: grid; place-items: center;
      font-family: Cinzel, serif; font-weight: 900; font-size: 1.05rem;
      background: rgba(0,0,0,0.45); border: 1.5px solid var(--frame); color: #fff;
    }
    .gem small { font-family: Inter, sans-serif; font-size: 0.5rem; letter-spacing: 1px; color: var(--muted); display: block; margin-bottom: -2px; }
    .crest {
      width: 58%; aspect-ratio: 1; margin: 6% auto 4%; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
      background: radial-gradient(circle at 35% 30%, hsl(var(--hue) 70% 62%), hsl(var(--hue) 60% 28%) 70%);
      border: 3px solid var(--frame);
      box-shadow: 0 0 0 5px rgba(0,0,0,0.35), 0 10px 24px rgba(0,0,0,0.5);
      font-family: Cinzel, serif; font-weight: 900; font-size: clamp(1.6rem, 4.2vw, 2.4rem); color: rgba(255,255,255,0.95);
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .name { font-family: Cinzel, serif; font-weight: 900; text-align: center; font-size: 1.02rem; line-height: 1.15; position: relative; z-index: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend-title { text-align: center; font-size: 0.68rem; color: rgba(255,255,255,0.6); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 1; }
    .weapons { display: flex; justify-content: center; gap: 4px; margin-top: 8px; flex-wrap: wrap; position: relative; z-index: 1; min-height: 20px; }
    .weapons span { font-size: 0.62rem; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12); }
    .ribbon {
      margin-top: auto; position: relative; z-index: 1; border-radius: 10px; padding: 7px 8px; text-align: center;
      font-size: 0.68rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    }
    .r-v .ribbon { background: linear-gradient(90deg, rgba(242,193,78,0.25), rgba(242,193,78,0.45), rgba(242,193,78,0.25)); color: var(--gold-2); }
    .r-bang .ribbon { background: rgba(111,143,199,0.22); color: #cfe0ff; }
    .r-x .ribbon { background: rgba(0,0,0,0.45); color: #c9c4d8; }
    .ribbon .prog { height: 3px; border-radius: 99px; background: rgba(255,255,255,0.12); margin-top: 5px; overflow: hidden; }
    .ribbon .prog i { display: block; height: 100%; background: currentColor; border-radius: inherit; }
    .new-tag {
      position: absolute; top: 52px; right: -30px; z-index: 2; transform: rotate(35deg);
      background: linear-gradient(90deg, #ff5f6d, #ffc371); color: #1b0b05; font-weight: 900; font-size: 0.62rem; letter-spacing: 2px;
      padding: 3px 34px;
    }

    /* back face */
    .back h3 { font-family: Cinzel, serif; font-size: 0.95rem; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
    .back h3 small { font-family: Inter, sans-serif; font-size: 0.65rem; color: var(--muted); }
    .stance-list { list-style: none; display: grid; gap: 3px; font-size: 0.72rem; }
    .stance-list li { display: flex; justify-content: space-between; gap: 6px; padding: 3px 7px; border-radius: 6px; background: rgba(255,255,255,0.04); color: var(--muted); }
    .stance-list li.on { color: var(--text); background: rgba(255,255,255,0.08); }
    .stance-list li.target { box-shadow: inset 2px 0 0 var(--gold); }
    .stance-list li.target span:first-child::after { content: ' ★'; color: var(--gold); }
    .stance-list b { color: var(--gold); margin-right: 5px; font-variant-numeric: tabular-nums; }
    .back-stats { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); margin: 8px 0 6px; }
    .back-stats b { display: block; color: var(--text); font-size: 0.82rem; }
    .pin-chip { font-family: Inter, sans-serif; font-size: 0.62rem; font-weight: 800; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); cursor: pointer; color: var(--muted); }
    .pin-chip.on { color: var(--gold); border-color: var(--gold); }
    .num .pinned { color: var(--gold); margin-left: 4px; }
    .lvl-ctrl { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: rgba(0,0,0,0.35); border-radius: 10px; padding: 4px; }
    .lvl-ctrl button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); cursor: pointer; font-weight: 900; }
    .lvl-ctrl button:hover { border-color: var(--gold); }
    .lvl-ctrl span { font-family: Cinzel, serif; font-weight: 900; }
    .flip-hint { text-align: center; font-size: 0.6rem; color: var(--muted); margin-top: 5px; letter-spacing: 1px; text-transform: uppercase; }

    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }
    .footer { max-width: 1240px; margin: 32px auto 0; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 0.8rem; color: var(--muted); }
    .footer a { color: var(--gold); text-decoration: none; font-weight: 700; }

    .toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; max-width: min(340px, calc(100vw - 32px)); }
    .toast { background: #17122a; border: 1px solid var(--gold); border-radius: 12px; padding: 12px 14px; font-size: 0.86rem; box-shadow: 0 12px 30px rgba(0,0,0,0.5); animation: rise 0.3s ease-out; }
    .toast strong { display: block; color: var(--gold-2); margin-bottom: 2px; }
    @keyframes rise { from { transform: translateY(12px); opacity: 0; } }

    @media (max-width: 640px) {
      :root { --card-w: 150px; }
      body { padding: 0 12px 40px; }
      .grid { gap: 12px; }
      .top { gap: 14px; padding-top: 16px; }
      .meter { width: 92px; height: 92px; }
      .meter-text b { font-size: 1.35rem; }
      .actions { width: 100%; }
      .id-input { flex: 1; width: auto; }
      .tools, .search { width: 100%; }
      .search { flex: 1; width: auto; }
      .face { padding: 9px; border-radius: 13px; }
      .name { font-size: 0.88rem; }
      .stance-list { font-size: 0.64rem; gap: 2px; }
      .stance-list li { padding: 2px 5px; }
      .back-stats { font-size: 0.6rem; }
      .back-stats b { font-size: 0.72rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .card-inner { transform: none !important; }
      .card.flipped .card-inner { transform: rotateY(180deg) !important; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffe8a3" /><stop offset="1" stop-color="#e08a1e" />
      </linearGradient>
    </defs>
  </svg>

  <header class="top">
    <div class="meter" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="52" />
        <circle class="fill" id="meterFill" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7" />
      </svg>
      <div class="meter-text"><b id="meterNum">0</b><span>of 70</span></div>
    </div>
    <div class="title-block">
      <div class="eyebrow">Legend Collection</div>
      <h1 id="playerName">Your Collection</h1>
      <div class="stars" id="stars" aria-label="Collection rank"></div>
      <div class="sub" id="playerSub">Sync your Brawlhalla ID to fill your collection.</div>
      <div class="sub" id="progressLine"></div>
    </div>
    <div class="actions">
      <input class="id-input" id="idInput" inputmode="numeric" placeholder="Your Brawlhalla ID" autocomplete="off" aria-label="Brawlhalla ID" />
      <button class="pill-btn gold" id="syncBtn">Sync</button>
    </div>
  </header>
  <div class="status" id="status"></div>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab" data-filter="ALL" aria-pressed="true">All<b id="cAll">70</b></button>
      <button class="tab t-v" data-filter="v" aria-pressed="false">✦ Foil<b id="cV">0</b></button>
      <button class="tab t-bang" data-filter="!" aria-pressed="false">◆ Rare<b id="cBang">0</b></button>
      <button class="tab t-x" data-filter="x" aria-pressed="false">Locked<b id="cX">0</b></button>
      <button class="tab" data-filter="PIN" aria-pressed="false">★ Pinned<b id="cPin">0</b></button>
    </div>
    <div class="tools">
      <input class="search" id="search" type="search" aria-label="Search cards" placeholder="Search legends, stances, weapons" autocomplete="off" />
      <select class="sort" id="sort" aria-label="Sort cards">
        <option value="order">Champ select order</option>
        <option value="rarity">Rarity</option>
        <option value="level">Level</option>
        <option value="needed">Closest to foil</option>
        <option value="games">Most played</option>
        <option value="recent">Recently unlocked</option>
      </select>
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <footer class="footer">
    <span>✦ Foil = target stance (v) · ◆ Rare = standard stance (!) · tap a card to flip it</span>
    <a href="index.html?view=desktop">Desktop view</a>
    <a href="app.html?view=mobile">Mobile view</a>
    <a href="matrix.html">Stance matrix</a>
    <a href="terminal.html">Terminal</a>
    <a href="compare.html">Compare</a>
    <a href="roadmap.html">Roadmap</a>
    <a href="pixel.html">Pixel</a>
  </footer>
  <div class="toasts" id="toasts"></div>

  <script src="legends.js"></script>
  <script src="core.js"></script>
  <script src="goals.js"></script>
  <script src="summary.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const { state } = Tracker;
    let filter = 'ALL';
    const flipped = new Set();
    const STANCE_LEVELS = [3, 4, 6, 8, 11, 13, 15, 17];
    const DAY = 24 * 60 * 60 * 1000;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const rarity = st => (st === 'v' ? 'v' : st === '!' ? 'bang' : 'x');
    function hueOf(name) {
      let h = 0;
      for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
      return h;
    }
    function monogram(name) {
      const parts = name.normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[\s&]+/).filter(Boolean);
      return (parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : name.slice(0, 2)).toUpperCase();
    }
    // Stance names in the target text, e.g. "Strength or Super Speed" -> ["Strength", "Super Speed"]
    const targetStances = legend => legend.target.replace(/[()]/g, '').split(/\s+or\s+/i).map(s => s.trim());
    // Latest real unlock for a legend. Entries starting from level 1 are skipped: those come from
    // the first sync filling in levels, not from new progress.
    function lastUnlockTs(name) {
      let ts = 0;
      state.log.forEach(e => { if (e.legend === name && e.oldLvl > 1 && e.oldStatus !== e.newStatus && e.ts > ts) ts = e.ts; });
      return ts;
    }
    const fmtHours = s => (!s ? '0h' : s >= 36000 ? `${Math.round(s / 3600)}h` : `${(s / 3600).toFixed(1)}h`);
    const winRate = (w, g) => (g ? `${Math.round((w / g) * 100)}%` : '–');
    function timeAgo(ts) {
      const m = Math.round((Date.now() - ts) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m} min ago`;
      const h = Math.round(m / 60);
      return h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
    }

    function cardHtml(l) {
      const lvl = Tracker.getLevel(l.name);
      const st = Tracker.statusOf(l, lvl);
      const r = rarity(st);
      const next = Tracker.nextTarget(l, lvl);
      const s = state.stats[l.name];
      const weapons = ((s && s.weapons) || []).filter(Boolean);
      const isNew = Date.now() - lastUnlockTs(l.name) < DAY;
      const targets = targetStances(l);
      const ribbon = st === 'v' ? '✦ Target unlocked'
        : next ? `${next.lvl - lvl} lvl${next.lvl - lvl === 1 ? '' : 's'} to ${next.status === 'v' ? 'foil' : 'rare'}` : '';
      return `
        <div class="card r-${r}${flipped.has(l.name) ? ' flipped' : ''}" style="--hue:${hueOf(l.name)}" data-name="${esc(l.name)}"
             tabindex="0" role="button" aria-label="${esc(l.name)}, level ${lvl}, ${st === 'v' ? 'target stance unlocked' : st === '!' ? 'standard stance unlocked' : 'locked'}. Press Enter to flip.">
          <div class="card-inner">
            <div class="face front">
              ${isNew ? '<div class="new-tag">NEW</div>' : ''}
              <div class="front-top">
                <span class="num">#${String(l.order).padStart(2, '0')}${Goals.has(l.name) ? '<span class="pinned">★</span>' : ''}</span>
                <span class="gem"><span><small>LV</small>${lvl}</span></span>
              </div>
              <div class="crest">${esc(monogram(l.name))}</div>
              <div class="name">${esc(l.name)}</div>
              <div class="legend-title">${esc(l.title)}</div>
              <div class="weapons">${weapons.map(w => `<span>${esc(w)}</span>`).join('')}</div>
              <div class="ribbon">${ribbon}
                ${st !== 'v' ? `<div class="prog"><i style="width:${Math.round(Tracker.progressToNext(l, lvl) * 100)}%"></i></div>` : ''}
              </div>
            </div>
            <div class="face back">
              <h3>${esc(l.name)} <button class="pin-chip${Goals.has(l.name) ? ' on' : ''}" data-pin aria-pressed="${Goals.has(l.name)}">${Goals.has(l.name) ? '★ Pinned' : '☆ Pin'}</button></h3>
              <ul class="stance-list">
                ${STANCE_LEVELS.map(sl => `
                  <li class="${lvl >= sl ? 'on' : ''}${targets.includes(l.stances[sl]) ? ' target' : ''}">
                    <span><b>${sl}</b>${esc(l.stances[sl])}</span><span>${lvl >= sl ? '✓' : '🔒'}</span>
                  </li>`).join('')}
              </ul>
              <div class="back-stats">
                <span>Games<b>${s ? (s.games || 0).toLocaleString() : '–'}</b></span>
                <span>Wins<b>${s ? winRate(s.wins, s.games) : '–'}</b></span>
                <span>Played<b>${s ? fmtHours(s.time) : '–'}</b></span>
              </div>
              <div class="lvl-ctrl">
                <button data-step="-1" aria-label="Level down">−</button>
                <span>Lv ${lvl}</span>
                <button data-step="1" aria-label="Level up">+</button>
              </div>
              <div class="flip-hint">tap to flip back</div>
            </div>
          </div>
        </div>`;
    }

    function render() {
      let v = 0, b = 0, x = 0;
      LEGENDS_DB.forEach(l => { const st = Tracker.statusOf(l, Tracker.getLevel(l.name)); st === 'v' ? v++ : st === '!' ? b++ : x++; });
      $('cV').textContent = v; $('cBang').textContent = b; $('cX').textContent = x; $('cAll').textContent = LEGENDS_DB.length;
      $('cPin').textContent = Goals.list().length;
      $('meterNum').textContent = v;
      $('meterFill').style.strokeDashoffset = 326.7 * (1 - v / LEGENDS_DB.length);
      const stars = Math.floor((v / LEGENDS_DB.length) * 5);
      $('stars').innerHTML = '★'.repeat(stars) + `<span class="off">${'★'.repeat(5 - stars)}</span>`;
      $('stars').setAttribute('aria-label', `Collection rank ${stars} of 5 stars`);

      const p = state.profile;
      if (p) {
        $('playerName').textContent = p.name;
        $('playerSub').innerHTML = [p.level ? `Level <b>${p.level}</b>` : '', p.games != null ? `<b>${p.games.toLocaleString()}</b> games` : '',
          p.games ? `<b>${winRate(p.wins, p.games)}</b> wins` : '', `synced ${timeAgo(p.syncedAt)}`].filter(Boolean).join(' · ');
      }

      const today = ProgressSummary.today(state.log), week = ProgressSummary.week(state.log);
      $('progressLine').innerHTML = week.levels
        ? `Today <b>${esc(ProgressSummary.describe(today))}</b> · this week <b>+${week.levels}</b> levels`
        : '';

      const q = $('search').value.trim().toLowerCase();
      const sortBy = $('sort').value;
      const rank = { v: 0, '!': 1, x: 2 };
      const need = l => { const lvl = Tracker.getLevel(l.name); const n = Tracker.nextTarget(l, lvl); return n ? l.vLvl - lvl : 999; };
      const list = LEGENDS_DB.filter(l => {
        const st = Tracker.statusOf(l, Tracker.getLevel(l.name));
        if (filter === 'PIN' ? !Goals.has(l.name) : filter !== 'ALL' && st !== filter) return false;
        if (!q) return true;
        const weapons = ((state.stats[l.name] && state.stats[l.name].weapons) || []).join(' ');
        return `${l.name} ${l.title} ${l.target} ${l.alt} ${weapons}`.toLowerCase().includes(q);
      }).sort((a, b2) => {
        const la = Tracker.getLevel(a.name), lb = Tracker.getLevel(b2.name);
        if (sortBy === 'rarity') return rank[Tracker.statusOf(a, la)] - rank[Tracker.statusOf(b2, lb)] || lb - la;
        if (sortBy === 'level') return lb - la || a.order - b2.order;
        if (sortBy === 'needed') return need(a) - need(b2) || a.order - b2.order;
        if (sortBy === 'games') return ((state.stats[b2.name] || {}).games || 0) - ((state.stats[a.name] || {}).games || 0);
        if (sortBy === 'recent') return lastUnlockTs(b2.name) - lastUnlockTs(a.name) || a.order - b2.order;
        return a.order - b2.order;
      });
      $('grid').innerHTML = list.length ? list.map(cardHtml).join('') : '<div class="empty">No cards match.</div>';
    }

    function toast(title, body) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = '<strong></strong><span></span>';
      t.querySelector('strong').textContent = title;
      t.querySelector('span').textContent = body;
      $('toasts').appendChild(t);
      setTimeout(() => t.remove(), 9000);
    }

    async function doSync() {
      const id = $('idInput').value.trim();
      if (!/^\d+$/.test(id)) { $('status').textContent = 'Enter your numeric Brawlhalla ID.'; $('idInput').focus(); return; }
      const firstSync = !state.profile || state.profile.id !== id;
      Tracker.setId(id);
      $('syncBtn').disabled = true;
      $('status').textContent = 'Opening packs…';
      const r = await Tracker.sync();
      $('syncBtn').disabled = false;
      if (r.error) { $('status').textContent = `Sync failed: ${r.error}`; return; }
      $('status').textContent = r.updated
        ? `✓ ${r.updated} cards updated${r.missing ? ` · ${r.missing} never played` : ''}`
        : 'Synced, but no levels came back (dair.gg may be down). Flip a card to set its level.';
      render();
      if (firstSync) return;
      const foil = r.unlocks.filter(u => { const l = LEGENDS_DB.find(x => x.name === u.legend); return l && u.lvl === l.vLvl; });
      if (foil.length && foil.length <= 5) foil.forEach(u => toast(`✦ New foil: ${u.legend}`, `${u.what} unlocked at level ${u.lvl}.`));
      else if (foil.length > 5) toast(`✦ ${foil.length} new foil cards`, 'Sort by "Recently unlocked" to see them.');
    }

    // ---------- events ----------
    $('grid').addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      const name = card.dataset.name;
      if (e.target.closest('[data-pin]')) {
        e.stopPropagation();
        if (!Goals.toggle(name)) toast('Goals full', `You can pin up to ${Goals.MAX} legends.`);
        render();
        return;
      }
      const step = e.target.closest('[data-step]');
      if (step) {
        e.stopPropagation();
        Tracker.setLevel(name, Tracker.getLevel(name) + Number(step.dataset.step));
        render();
        const again = document.querySelector(`.card[data-name="${CSS.escape(name)}"]`);
        if (again) again.focus();
        return;
      }
      if (flipped.has(name)) flipped.delete(name); else flipped.add(name);
      card.classList.toggle('flipped');
    });
    $('grid').addEventListener('keydown', e => {
      const card = e.target.closest('.card');
      if (!card || e.target !== card || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      card.click();
    });

    // 3D tilt and foil glare following the pointer (mouse only)
    const canTilt = window.matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches;
    if (canTilt) {
      $('grid').addEventListener('pointermove', e => {
        const card = e.target.closest('.card');
        if (!card || card.classList.contains('flipped')) return;
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        const inner = card.firstElementChild;
        inner.style.setProperty('--ry', `${(px - 0.5) * 16}deg`);
        inner.style.setProperty('--rx', `${(0.5 - py) * 16}deg`);
        card.style.setProperty('--mx', `${px * 100}%`);
        card.style.setProperty('--my', `${py * 100}%`);
      });
      $('grid').addEventListener('pointerout', e => {
        const card = e.target.closest('.card');
        if (card && !card.contains(e.relatedTarget)) {
          card.firstElementChild.style.removeProperty('--rx');
          card.firstElementChild.style.removeProperty('--ry');
        }
      });
    }

    $('tabs').addEventListener('click', e => {
      const tab = e.target.closest('[data-filter]');
      if (!tab) return;
      filter = tab.dataset.filter;
      document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-pressed', String(t === tab)));
      render();
    });
    let searchTimer;
    $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(render, 120); });
    $('sort').addEventListener('change', render);
    $('syncBtn').addEventListener('click', doSync);
    $('idInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSync(); });

    // ---------- startup ----------
    const linkId = new URLSearchParams(location.search).get('id');
    $('idInput').value = linkId && /^\d+$/.test(linkId) ? linkId : state.id;
    render();
    if (linkId && /^\d+$/.test(linkId)) {
      history.replaceState(null, '', location.pathname);
      doSync();
    } else if (state.id && (!state.profile || Date.now() - state.profile.syncedAt > 10 * 60 * 1000)) {
      doSync();
    }
    setInterval(render, 5 * 60 * 1000);
  </script>
  <script>
    // Offline support (only works over http/https, not when opened as a file)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
